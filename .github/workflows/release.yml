name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        run: printf '%s\n' "$GITHUB_REF_NAME" > VERSION

      - name: Detect prerelease
        id: release
        run: |
          if printf '%s' "$GITHUB_REF_NAME" | grep -Eiq '(^|[-._])(alpha|beta|rc|pre|preview|dev|nightly|canary|snapshot)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare package name
        run: |
          PACKAGE_NAME="NPK-X-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '_')"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"

      - name: Assemble portable package
        run: |
          mkdir -p "dist/$PACKAGE_NAME"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='SHA256SUMS.txt' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ "dist/$PACKAGE_NAME/"

      - name: Generate package checksums
        working-directory: dist/${{ env.PACKAGE_NAME }}
        run: |
          find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create zip archive
        run: |
          cd dist
          zip -r -9 "$PACKAGE_NAME.zip" "$PACKAGE_NAME"
          sha256sum "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NPK-X ${{ github.ref_name }}
          files: |
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.PACKAGE_NAME }}.zip.sha256
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  bump-version:
    needs: release
    if: needs.release.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update VERSION
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" > VERSION
          if git diff --quiet -- VERSION; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: set VERSION to $GITHUB_REF_NAME"
          git push origin HEAD:${{ github.event.repository.default_branch }}
