<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPK-X</title>
<link rel="stylesheet" href="/static/style.css?v=26">
</head>
<body>
<svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="exp-back" x1="16" y1="4.75" x2="16" y2="11.75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD152"/>
      <stop offset="1" stop-color="#FFB83D"/>
    </linearGradient>
    <linearGradient id="exp-front" x1="16" y1="11.06" x2="16" y2="29.97" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FE0FF"/>
      <stop offset="1" stop-color="#2E9BE6"/>
    </linearGradient>
  </defs>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <polyline points="23 4 23 10 17 10"/>
    <polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </symbol>
  <symbol id="i-grid" viewBox="0 0 24 24">
    <rect x="3" y="3" width="7" height="7" rx="1"/>
    <rect x="14" y="3" width="7" height="7" rx="1"/>
    <rect x="3" y="14" width="7" height="7" rx="1"/>
    <rect x="14" y="14" width="7" height="7" rx="1"/>
  </symbol>
  <symbol id="i-list" viewBox="0 0 24 24">
    <line x1="8" y1="6" x2="21" y2="6"/>
    <line x1="8" y1="12" x2="21" y2="12"/>
    <line x1="8" y1="18" x2="21" y2="18"/>
    <line x1="3" y1="6" x2="3.01" y2="6"/>
    <line x1="3" y1="12" x2="3.01" y2="12"/>
    <line x1="3" y1="18" x2="3.01" y2="18"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18"/>
    <line x1="6" y1="6" x2="18" y2="18"/>
  </symbol>
  <symbol id="i-zoom" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    <line x1="8" y1="11" x2="14" y2="11"/>
    <line x1="11" y1="8" x2="11" y2="14"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <polygon points="7 4 20 12 7 20 7 4" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24">
    <polyline points="15 18 9 12 15 6"/>
  </symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24">
    <polyline points="9 18 15 12 9 6"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>
  <symbol id="i-minus" viewBox="0 0 24 24">
    <line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>
  <symbol id="i-fit" viewBox="0 0 24 24">
    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
  </symbol>
  <symbol id="i-explorer" viewBox="0 0 32 32">
    <path d="M3.82 4.13C2.86 4.13 2.07 4.91 2.07 5.88V25.19C2.07 26.15 2.86 26.94 3.83 26.94H28.18C29.14 26.94 29.93 26.15 29.93 25.19V9.78C29.93 8.81 29.14 8.03 28.18 8.03H17.31C16.8 8.03 16.3 7.83 15.93 7.48L13 4.68C12.63 4.32 12.13 4.13 11.62 4.13H3.82Z" fill="url(#exp-back)"/>
    <rect x="2.07" y="11.06" width="27.84" height="18.91" rx="1.75" fill="url(#exp-front)"/>
    <path d="M6.2 15.4H25.8" stroke="#E9FBFF" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
  </symbol>
  <symbol id="i-vscode" viewBox="0 0 24 24">
    <path fill="#007ACC" d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z"/>
  </symbol>
  <symbol id="i-idea" viewBox="0 0 24 24">
    <path fill="#FE315D" d="M0 0v24h24V0zm3.723 3.111h5v1.834h-1.39v6.277h1.39v1.834h-5v-1.834h1.444V4.945H3.723zm11.055 0H17v6.5c0 .612-.055 1.111-.222 1.556-.167.444-.39.777-.723 1.11-.277.279-.666.557-1.11.668a3.933 3.933 0 0 1-1.445.278c-.778 0-1.444-.167-1.944-.445a4.81 4.81 0 0 1-1.279-1.056l1.39-1.555c.277.334.555.555.833.722.277.167.611.278.945.278.389 0 .721-.111 1-.389.221-.278.333-.667.333-1.278zM2.222 19.5h9V21h-9z"/>
  </symbol>
</svg>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">NPK-X</div>
      <div class="brand-sub">浏览、搜索与预览</div>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><span id="stat-files">—</span><small>文件</small></div>
      <div class="stat"><span id="stat-size">—</span><small>总大小</small></div>
    </div>
    <div class="side-heading">目录结构</div>
    <nav class="roots" id="roots"></nav>
    <div class="side-foot"><span class="status-dot"></span>资源库已就绪</div>
  </aside>

  <main class="main">
    <div class="content-topbar" id="content-topbar">
      <header class="topbar">
        <div class="searchbox">
          <input id="search" type="search" placeholder="搜索资源名称或路径，例如 login、pet、effect" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </div>
        <div class="view-actions">
          <select id="sort" class="sort-select" title="排序">
            <option value="name_asc">名称 A–Z</option>
            <option value="name_desc">名称 Z–A</option>
            <option value="size_desc">大小从大到小</option>
            <option value="size_asc">大小从小到大</option>
            <option value="type">按类型</option>
            <option value="package">按来源</option>
          </select>
          <button id="refresh" class="icon-btn" title="刷新" aria-label="刷新"><svg class="icon"><use href="#i-refresh"></use></svg></button>
          <button id="view-grid" class="icon-btn" title="网格" aria-label="网格视图"><svg class="icon"><use href="#i-grid"></use></svg></button>
          <button id="view-list" class="icon-btn" title="列表" aria-label="列表视图"><svg class="icon"><use href="#i-list"></use></svg></button>
        </div>
      </header>
      <div class="crumb" id="crumb"></div>
      <div class="toolbar">
        <div id="where" class="where">正在加载…</div>
        <div id="count" class="count"></div>
      </div>
    </div>
    <div class="workspace">
      <section id="content" class="content"></section>
      <aside class="index-pane" id="index-pane">
        <div class="index-head">
          <span>当前目录索引</span>
        </div>
        <div class="index-body">
          <div class="index-path" id="index-path">全部资源</div>
          <div class="index-summary" id="index-summary"></div>
          <div class="index-actions">
            <button class="mini-btn" id="index-up">上一级</button>
            <button class="mini-btn" id="copy-index">复制路径</button>
          </div>
          <div class="index-section">文件类型</div>
          <div class="kind-chips" id="index-kinds"></div>
          <div class="index-section">子目录</div>
          <div class="index-dirs" id="index-dirs"></div>
        </div>
      </aside>
    </div>
  </main>
</div>

<div id="drawer" class="drawer hidden" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-title">
      <div id="preview-badge" class="badge">FILE</div>
      <div class="drawer-name" id="preview-name">预览</div>
    </div>
    <button id="close-drawer" class="icon-btn" title="关闭" aria-label="关闭"><svg class="icon"><use href="#i-close"></use></svg></button>
  </div>
  <div class="drawer-nav">
    <button id="prev-file" class="mini-btn" title="上一个条目"><svg class="icon"><use href="#i-chevron-left"></use></svg>上一个</button>
    <span id="file-position" class="drawer-pos"></span>
    <button id="next-file" class="mini-btn" title="下一个条目">下一个<svg class="icon"><use href="#i-chevron-right"></use></svg></button>
  </div>
  <div class="drawer-body">
    <div id="preview-media" class="preview-media"></div>
    <div class="section-title">文件信息</div>
    <div id="preview-meta" class="meta-grid"></div>
    <div class="open-row">
      <span class="open-label">通过…打开</span>
      <div id="open-actions" class="open-actions"></div>
    </div>
    <div class="drawer-actions">
      <a id="download-link" class="btn primary" href="#" download>下载文件</a>
      <button id="copy-path" class="btn">复制路径</button>
      <a id="open-image" class="btn hidden" href="#" target="_blank" rel="noopener">新窗口查看</a>
    </div>
    <div id="preview-note" class="note"></div>
  </div>
</div>
<div id="overlay" class="overlay hidden"></div>

<div id="viewer" class="viewer hidden" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="viewer-panel">
    <div class="viewer-head">
      <div class="viewer-name" id="viewer-name"></div>
      <button id="viewer-close" class="icon-btn" title="关闭" aria-label="关闭"><svg class="icon"><use href="#i-close"></use></svg></button>
    </div>
    <div class="viewer-stage" id="viewer-stage"></div>
    <div class="viewer-foot" id="viewer-foot"></div>
  </div>
</div>

<script src="/static/app.js?v=26"></script>
</body>
</html>
