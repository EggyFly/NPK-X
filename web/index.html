  <div class="drawer-head">
    <div class="drawer-title">
      <div id="preview-badge" class="badge">FILE</div>
      <div class="drawer-label">
        <div class="drawer-name" id="preview-name" data-i18n="drawer.preview">预览</div>
        <div class="drawer-sub hidden" id="preview-sub"></div>
      </div>
    </div>
    <button id="close-drawer" class="icon-btn" title="关闭" data-i18n-title="drawer.close" aria-label="关闭" data-i18n-aria="drawer.close"><svg class="icon"><use href="#i-close"></use></svg></button>
  </div>
  <div class="drawer-nav">
    <button id="prev-file" class="mini-btn" title="上一个" data-i18n-title="drawer.prev"><svg class="icon"><use href="#i-chevron-left"></use></svg><span data-i18n="drawer.prev">上一个</span></button>
    <span id="file-position" class="drawer-pos"></span>
    <button id="next-file" class="mini-btn" title="下一个" data-i18n-title="drawer.next"><span data-i18n="drawer.next">下一个</span><svg class="icon"><use href="#i-chevron-right"></use></svg></button>
  </div>
  <div class="drawer-body">
    <div id="preview-media" class="preview-media"></div>
    <div class="section-title" data-i18n="drawer.fileInfo">文件信息</div>
    <div id="preview-meta" class="meta-grid"></div>
    <div class="open-row">
      <span class="open-label" data-i18n="drawer.openWith">通过…打开</span>
      <div id="open-actions" class="open-actions"></div>
    </div>
    <div class="drawer-actions">
      <a id="download-link" class="btn primary" href="#" download data-i18n="drawer.download">下载文件</a>
      <button id="copy-path" class="btn" data-i18n="drawer.copyPath">复制路径</button>
      <a id="open-image" class="btn hidden" href="#" target="_blank" rel="noopener" data-i18n="drawer.newWindow">新窗口查看</a>
    </div>
    <div id="preview-note" class="note"></div>
  </div>
</div>
<div id="overlay" class="overlay hidden"></div>

<div id="viewer" class="viewer hidden" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="viewer-panel">
    <div class="viewer-head">
      <div class="viewer-title">
        <div class="viewer-name" id="viewer-name"></div>
        <div class="viewer-sub hidden" id="viewer-sub"></div>
      </div>
      <span class="viewer-stats" id="viewer-stats"></span>
      <button id="viewer-close" class="icon-btn" title="关闭" data-i18n-title="viewer.close" aria-label="关闭" data-i18n-aria="viewer.close"><svg class="icon"><use href="#i-close"></use></svg></button>
    </div>
    <div class="viewer-stage" id="viewer-stage"></div>
    <div class="viewer-foot" id="viewer-foot"></div>
  </div>
</div>

<div id="update-toast" class="update-toast hidden" role="status" aria-live="polite">
  <div class="update-toast-copy">
    <b id="update-toast-title"></b>
    <span id="update-toast-text"></span>
  </div>
  <a id="update-toast-link" class="mini-btn" href="https://github.com/EggyFly/NPK-X/releases" target="_blank" rel="noopener noreferrer" data-i18n="update.view">查看更新</a>
  <button id="update-toast-close" class="icon-btn" type="button" title="关闭" data-i18n-title="common.close" aria-label="关闭" data-i18n-aria="common.close"><svg class="icon"><use href="#i-close"></use></svg></button>
</div>

<div id="batch-toast" class="update-toast batch-toast hidden" role="status" aria-live="polite">
  <span class="spinner batch-toast-spin hidden" id="batch-toast-spin"></span>
  <div class="update-toast-copy">
    <b id="batch-toast-title"></b>
    <span id="batch-toast-text"></span>
  </div>
  <button id="batch-toast-close" class="icon-btn" type="button" title="关闭" data-i18n-title="common.close" aria-label="关闭" data-i18n-aria="common.close"><svg class="icon"><use href="#i-close"></use></svg></button>
</div>

  <script src="/static/app.js?v=110"></script>
</body>
</html>
